plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

allprojects {
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.encoding = 'UTF-8'
        }
    }
    tasks.withType(JavaExec).tap {
        configureEach {
            jvmArgs '-Dfile.encoding=UTF-8'
        }
    }
}

group 'org.example'
version '1.0-SNAPSHOT'

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-logging'

    implementation 'org.springframework:spring-aspects'
    implementation 'org.springframework:spring-webmvc'

    implementation 'org.hibernate.orm:hibernate-core:6.6.11.Final'
    implementation 'org.hibernate:hibernate-c3p0:6.6.11.Final'
    implementation 'org.hibernate.orm:hibernate-ehcache:6.0.0.Alpha7'

    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.flywaydb:flyway-core:9.0.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.mongodb:mongodb-driver-sync:5.4.0'
    implementation 'org.mongodb:mongodb-driver-core:5.4.0'

    implementation 'commons-fileupload:commons-fileupload:1.5'
}

test {
    useJUnitPlatform()
}

